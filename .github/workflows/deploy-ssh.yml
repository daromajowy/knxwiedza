name: Publikacja na własny hosting (SSH)

# Wysyła zbudowaną stronę na serwer przez SSH (rsync).
# Wymaga sekretów w Settings → Secrets and variables → Actions:
#   SSH_HOST  – np. v104.vh.net.pl
#   SSH_PORT  – zwykle 22
#   SSH_USER  – login SSH na hostingu
#   SSH_KEY   – klucz prywatny (cała zawartość pliku, razem z liniami BEGIN/END)
#   SSH_PATH  – katalog docelowy na serwerze, np. public_html/knx/
#   SSH_KEY_PASSPHRASE – hasło klucza, jeśli klucz ma hasło (np. klucz wygenerowany w cPanelu); opcjonalny
# Bez SSH_HOST workflow kończy się bez publikacji.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdź konfigurację
        id: cfg
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "Brak sekretu SSH_HOST – pomijam publikację na hosting."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - if: steps.cfg.outputs.enabled == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.cfg.outputs.enabled == 'true'
        run: |
          pip install -r requirements.txt
          mkdocs build --strict

      - name: Wyślij na serwer
        if: steps.cfg.outputs.enabled == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
          SSH_KEY_PASSPHRASE: ${{ secrets.SSH_KEY_PASSPHRASE }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            # Zdejmij hasło z kopii klucza na czas tej publikacji (tylko na maszynie GitHub Actions).
            ssh-keygen -p -q -P "$SSH_KEY_PASSPHRASE" -N "" -f ~/.ssh/id_deploy
          fi
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete --exclude '.htaccess' --exclude '.htpasswd' \
            -e "ssh -p ${SSH_PORT:-22} -i ~/.ssh/id_deploy" \
            site/ "$SSH_USER@$SSH_HOST:$SSH_PATH"
